<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12141a" />
<title>wfcalc</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand">wfcalc</div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="build" role="tab">Build</button>
    <button class="tab" data-tab="compare" role="tab">Compare</button>
    <button class="tab" data-tab="saved" role="tab">Saved</button>
  </nav>
</header>

<!-- ───────────────────────────── BUILD ───────────────────────────── -->
<main id="tab-build" class="tab-panel active">

  <!-- header: weapon + headline numbers, like Overframe's build header -->
  <section class="panel build-header">
    <div class="weapon-row">
      <label class="field grow">
        <span>Weapon</span>
        <input id="weapon-input" list="weapon-list" placeholder="Kuva Bramma" autocomplete="off" />
      </label>
      <label class="field" id="mode-field" hidden>
        <span>Fire mode</span>
        <select id="mode-select"></select>
      </label>
    </div>
    <datalist id="weapon-list"></datalist>
    <div id="weapon-meta" class="meta"></div>
    <div id="weapon-summary" class="summary"></div>
  </section>

  <div class="builder">
    <!-- left rail: stats, the way the arsenal lists them -->
    <aside class="panel rail stats-panel">
      <div class="panel-head"><h2>Stats</h2></div>
      <div id="stats" class="stat-list"></div>
      <h3>Damage</h3>
      <div id="damage-bars" class="bars"></div>
      <h3>Target</h3>
      <label class="field">
        <span>Enemy</span>
        <input id="enemy-input" list="enemy-list" placeholder="Bombard" autocomplete="off" />
      </label>
      <datalist id="enemy-list"></datalist>
      <label class="field">
        <span>Level <b id="level-value">100</b></span>
        <input id="level-input" type="range" min="1" max="200" value="100" />
      </label>
      <div id="enemy-meta" class="meta"></div>
      <div id="target-report"></div>
    </aside>

    <!-- centre: the board, slots on a dark backdrop -->
    <section class="panel board mods-panel">
      <div class="panel-head">
        <h2>Mods <span id="mod-count" class="badge">0</span></h2>
        <div id="capacity" class="capacity"></div>
      </div>
      <div class="board-tools">
        <label class="toggles"><label><input type="checkbox" id="reactor" /> Orokin Reactor</label></label>
        <span class="hint">drag to reorder · drop outside to remove</span>
      </div>
      <div id="slots" class="slots"></div>
      <div id="mod-arcane" class="arcane-slot">
        <label class="field">
          <span>Weapon arcane</span>
          <input id="arcane-input" list="arcane-list" placeholder="Primary Merciless" autocomplete="off" />
        </label>
      </div>
      <datalist id="arcane-list"></datalist>
      <h3>Contribution</h3>
      <div id="contributions" class="bars"></div>
    </section>

    <!-- right rail: the library, always in sight like Overframe's filter panel -->
    <aside class="panel rail library-panel">
      <div class="panel-head"><h2>Library</h2><span id="lib-count" class="badge"></span></div>
      <input id="mod-filter" placeholder="search mods…" autocomplete="off" />
      <div class="filters">
        <select id="filter-polarity" aria-label="Polarity">
          <option value="">All polarities</option>
          <option value="madurai">Madurai</option>
          <option value="vazarin">Vazarin</option>
          <option value="naramon">Naramon</option>
          <option value="zenurik">Zenurik</option>
          <option value="unairu">Unairu</option>
          <option value="penjaga">Penjaga</option>
          <option value="umbra">Umbra</option>
        </select>
        <select id="filter-type" aria-label="Type"><option value="">All types</option></select>
        <select id="filter-rarity" aria-label="Rarity">
          <option value="">All rarities</option>
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="rare">Rare</option>
          <option value="legendary">Legendary</option>
        </select>
        <select id="filter-sort" aria-label="Sort">
          <option value="name">Name</option>
          <option value="share">Contribution</option>
        </select>
      </div>
      <div id="mod-list" class="lib"></div>
    </aside>
  </div>

  <section class="panel stack-panel">
    <details>
      <summary>Conditions &amp; stacks</summary>
      <div class="toggles">
        <label><input type="checkbox" id="headshot" /> weak point hit</label>
        <label><input type="checkbox" id="aiming" /> aiming</label>
        <label class="stack">On-kill <input type="number" id="onkill" min="0" max="10" value="0" /></label>
        <label class="stack">Status types <input type="number" id="status-types" min="1" max="12" value="1" /></label>
        <label class="stack">Viral <input type="number" id="viral" min="0" max="10" value="0" /></label>
        <label class="stack">Corrosive <input type="number" id="corrosive" min="0" max="10" value="0" /></label>
      </div>
    </details>

    <details>
      <summary>Frame &amp; buffs <span id="buff-count" class="badge"></span></summary>
      <div class="row">
        <label class="field"><span>Warframe</span>
          <input id="frame-input" list="frame-list" placeholder="Rhino" autocomplete="off" /></label>
        <label class="field"><span>Ability strength <b id="strength-value">100%</b></span>
          <input id="strength-input" type="range" min="40" max="500" step="5" value="100" /></label>
      </div>
      <datalist id="frame-list"></datalist>
      <label class="field"><span>Warframe mods</span>
        <input id="framemods-input" placeholder="Intensify, Blind Rage" autocomplete="off" /></label>
      <label class="field"><span>Warframe arcanes</span>
        <input id="framearcane-input" placeholder="Arcane Avenger" autocomplete="off" /></label>
      <label class="field"><span>Covenant: damage prevented</span>
        <input id="covenant-damage" type="number" min="0" step="500" placeholder="0" /></label>
      <div id="buff-list" class="buffs"></div>
    </details>

    <details>
      <summary>Riven, Incarnon &amp; combo</summary>
      <label class="field"><span>Riven stats (− marks the malus)</span>
        <input id="riven-input" placeholder="damage,multishot,-zoom" autocomplete="off" /></label>
      <div class="row">
        <label class="field"><span>Riven roll <b id="roll-value">1.00</b></span>
          <input id="riven-roll" type="range" min="0.9" max="1.1" step="0.01" value="1" /></label>
        <label class="field"><span>Riven rank <b id="rinkrank-value">8</b></span>
          <input id="riven-rank" type="range" min="0" max="8" step="1" value="8" /></label>
      </div>
      <label class="field"><span>Incarnon evolutions (EVO2:0, EVO4:1)</span>
        <input id="incarnon-input" placeholder="EVO2:0" autocomplete="off" /></label>
      <div id="incarnon-meta" class="meta"></div>
      <label class="field"><span>Melee combo hits <b id="combo-value">0</b></span>
        <input id="combo-input" type="range" min="0" max="240" step="20" value="0" /></label>
      <div class="row">
        <label class="toggles"><label><input type="checkbox" id="heavy" /> heavy attack</label></label>
        <label class="field"><span>AoE distance <b id="aoe-value">centre</b></span>
          <input id="aoe-input" type="range" min="0" max="12" step="0.5" value="0" /></label>
      </div>
      <label class="field"><span>Kuva/Tenet element bonus</span>
        <input id="element-bonus" placeholder="heat:60" autocomplete="off" /></label>
    </details>

    <div class="actions">
      <button id="save-build" class="primary">save build</button>
      <button id="share" class="ghost">copy link</button>
    </div>
  </section>

  <section class="panel wide"><div id="notes" class="notes"></div></section>
</main>

<!-- ──────────────────────────── COMPARE ──────────────────────────── -->
<main id="tab-compare" class="tab-panel">
  <section class="panel wide">
    <div class="panel-head">
      <h2>Compare</h2>
      <button id="compare-run" class="primary">compare</button>
    </div>
    <p class="hint">A is the current build. Leave a field empty in B to reuse A's value.</p>
    <div class="compare-grid">
      <label class="field"><span>B: weapon</span>
        <input id="b-weapon" placeholder="same as A" autocomplete="off" list="weapon-list" /></label>
      <label class="field"><span>B: mods (slot order)</span>
        <input id="b-mods" placeholder="Serration, Split Chamber, Vital Sense" autocomplete="off" /></label>
      <label class="field"><span>B: element bonus</span>
        <input id="b-element" placeholder="heat:60" autocomplete="off" /></label>
      <label class="field"><span>B: arcane</span>
        <input id="b-arcane" placeholder="same as A" autocomplete="off" list="arcane-list" /></label>
    </div>
    <div id="compare-out" class="compare-out"></div>
  </section>
</main>

<!-- ───────────────────────────── SAVED ───────────────────────────── -->
<main id="tab-saved" class="tab-panel">
  <section class="panel wide">
    <div class="panel-head"><h2>Saved builds</h2><span id="saved-count" class="badge"></span></div>
    <div id="saved-list" class="saved-list"></div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
